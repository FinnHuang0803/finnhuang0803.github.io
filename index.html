<!doctype html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finn Huang</title>
<!-- Opt in to the page transition before anything else loads, so Chrome always sees it (§4.2). -->
<style>@view-transition { navigation: auto; }</style>
<meta name="description" content="Finn Huang is a UI/UX designer in New Taipei.">
<link rel="icon" href="/favicon.ico" sizes="32x32">

<meta property="og:image" content="https://finnhuang0803.github.io/share-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://finnhuang0803.github.io/share-card.png">
<script src="/assets/js/theme-init.js"></script>
<script src="/assets/js/transition.js"></script>
<script>document.documentElement.classList.add("js")</script>
<link rel="preload" href="/assets/fonts/cal-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

<script type="module" src="/assets/js/site.js"></script>
<script type="module" src="/assets/js/home.js"></script>

<body>
  <!-- Background pattern (§4.1): resting layer + pointer spotlight, drawn behind everything. -->
  <div class="home-bg" aria-hidden="true"><div class="home-bg__rest"></div><div class="home-bg__lit"></div></div>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Navigation bar: identical on every page; only aria-current moves. -->
  <header class="site-nav">
    <div class="container site-nav__inner">
      <a class="site-nav__name" href="/">Finn Huang</a>
      <nav aria-label="Main">
        <ul class="site-nav__list">
          <li><a class="site-nav__link" href="/" aria-current="page">Work</a></li>
          <li><a class="site-nav__link" href="/lab/">Lab</a></li>
          <li><a class="site-nav__link" href="/about/">About</a></li>
        </ul>
      </nav>
      <button class="theme-toggle sq" data-squircle="12" type="button" aria-label="Switch theme">
        <svg class="sq-shape" aria-hidden="true"><path class="hover"/><path class="ring"/></svg>
        <svg class="theme-toggle__icon" viewBox="0 0 24 24" aria-hidden="true">
          <mask id="theme-toggle-mask" maskUnits="userSpaceOnUse" x="-4" y="-4" width="32" height="32">
            <rect x="-4" y="-4" width="32" height="32" fill="#fff"/>
            <circle class="theme-toggle__cut" cx="17.2" cy="7.6" r="7.4" fill="#000"/>
          </mask>
          <g mask="url(#theme-toggle-mask)"><circle class="theme-toggle__disc" cx="12" cy="12" r="5"/></g>
          <path class="theme-toggle__rays" d="M12 1.8v2M12 20.2v2M1.8 12h2M20.2 12h2M4.79 4.79l1.41 1.41M17.8 17.8l1.41 1.41M4.79 19.21l1.41-1.41M17.8 6.2l1.41-1.41"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="main" class="page">
    <h1 class="visually-hidden">Work</h1>

    <!-- Opening (§4.1): "Good design is" + a phrase that changes every 3s with a split-flap wave. -->
    <section class="opening" aria-label="Opening">
      <div class="container">
        <p class="opening__statement" data-page-enter data-flap-static="Good design is" data-flap='["a great user experience.", "intuitive to use.", "easy to understand.", "accessible to all."]'>Good design is a great user experience.</p>
      </div>
      <!-- Scroll hint: fades in 2s after arrival, fades out as soon as the page scrolls. -->
      <svg class="scroll-hint" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v15M6 13l6 6 6-6"/></svg>
    </section>

    <!-- Project cards (§4.2), built from /content/projects.json. -->
    <section class="work" aria-labelledby="work-heading">
      <div class="container">
        <h2 class="visually-hidden" id="work-heading">Projects</h2>
        <ul class="card-grid" data-project-grid></ul>
      </div>
    </section>

    <!-- The "View" magnifier that replaces the cursor over a card. -->
    <div class="view-cursor" aria-hidden="true"><div class="view-cursor__glass"><span class="view-cursor__handle"></span><span class="view-cursor__lens">View</span></div></div>
  </main>

  <!-- Footer: identical on every page. -->
  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p class="site-footer__credit">Finn Huang · Made with Claude Code</p>
      <ul class="site-footer__links">
        <li><a class="site-footer__link" href="https://www.linkedin.com/in/finn-huang-227323421" target="_blank" rel="noopener">LinkedIn</a></li>
        <li><a class="site-footer__link" href="https://www.behance.net/huangjack2" target="_blank" rel="noopener">Behance</a></li>
        <li><a class="site-footer__link" href="/Finn-Huang-Resume.pdf" target="_blank" rel="noopener">Résumé</a></li>
        <li><a class="site-footer__link" href="/Finn-Huang-Resume-zh.pdf" target="_blank" rel="noopener" lang="zh-Hant">中文履歷</a></li>
      </ul>
    </div>
  </footer>
</body>
</html>
