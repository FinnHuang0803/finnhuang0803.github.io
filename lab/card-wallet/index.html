<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card wallet</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("fonts/inter-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }

  /* Linen + Ember tokens (site-design-system.md §2) */
  :root {
    color-scheme: light;
    --bg: #F5F3EF;
    --surface: #ECE9E4;
    --line: #DEDAD3;
    --nav-selected: #E4E0D9;
    --ink: #242424;
    --ink-2: #575757;
    --ink-3: #696969;
    --accent: #C2410C;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #161514;
      --surface: #1F1E1C;
      --line: #2C2A27;
      --nav-selected: #2B2926;
      --ink: #E6E6E6;
      --ink-2: #B0B0B0;
      --ink-3: #8C8C8C;
      --accent: #FB8A5C;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #161514;
    --surface: #1F1E1C;
    --line: #2C2A27;
    --nav-selected: #2B2926;
    --ink: #E6E6E6;
    --ink-2: #B0B0B0;
    --ink-3: #8C8C8C;
    --accent: #FB8A5C;
  }

  /* Spring easing for hover / press (generated in JS; this is a fallback). */
  :root {
    --spring-press: cubic-bezier(.3, 1.4, .5, 1);
    --spring-press-dur: 360ms;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 25.6px;
    font-weight: 420;
    letter-spacing: -0.011em;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 16px;
    transition: background-color 400ms ease, color 400ms ease;
  }

  .proto {
    width: min(320px, 100%);
    display: grid;
    gap: 8px;
  }

  .label {
    font-size: 13px;
    line-height: 1.5;
    font-weight: 450;
    color: var(--ink-3);
    letter-spacing: -0.006em;
    user-select: none;
  }

  /* Stage: cards are positioned by JS (translateY + opacity). */
  .stage {
    --card-h: 202px;
    --peek: 40px;
    position: relative;
    height: calc(var(--card-h) + 3 * var(--peek));
    perspective: 1000px;             /* real depth for the flip and the stack */
    perspective-origin: 50% 20%;
    touch-action: none;              /* our own vertical drag, also on touch screens */
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .stage.is-dragging { cursor: grabbing; }
  .stage.is-popped { cursor: pointer; }
  /* While a card is out, the others sink into the "pocket": cut off at the stage's bottom edge. */
  .stage.is-pocket { clip-path: inset(-400px -200px 0 -200px); }

  .card {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: var(--card-h);
    transform-origin: 50% 100%;      /* the flip axis: the card's bottom edge */
    backface-visibility: hidden;     /* a card flipped past 90° is gone, never seen from behind */
    will-change: transform, opacity;
  }

  /* Squircle shapes: element is clipped to the path, fill drawn on the same path. */
  .sq { position: relative; isolation: isolate; }
  .sq > svg.shape {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    overflow: visible;
    pointer-events: none;
    z-index: -1;
  }

  .face {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 10px 20px 18px;
    color: #FFFFFF;
    transition: transform var(--spring-press-dur) var(--spring-press);
  }
  .face > svg.shape .fill { fill: var(--card); }
  .face > svg.shape .ring { fill: none; stroke: var(--accent); stroke-width: 4; opacity: 0; }

  .name {
    font-size: 15px;
    line-height: 20px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .num {
    font-size: 15px;
    line-height: 20px;
    font-weight: 450;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }

  /* Instant feedback: hover lifts a card a little, press presses it in. */
  @media (hover: hover) {
    .stage:not(.is-dragging) .card:hover .face { transform: translateY(-4px); }
  }
  .stage:not(.is-dragging) .card.is-pressed .face { transform: scale(.98); transition-duration: 120ms; transition-timing-function: ease-out; }

  /* Keyboard focus: accent ring on the front (or popped) card. */
  .stage:focus-visible .card.is-current .face > svg.shape .ring { opacity: 1; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    margin: -1px; padding: 0; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .face { transition: none !important; }
    .stage .card:hover .face, .stage .card.is-pressed .face { transform: none !important; }
  }
</style>
</head>
<body>
  <div class="proto">
    <span class="label" id="wallet-label">Wallet</span>
    <div class="stage" id="stage" tabindex="0" role="group"
         aria-labelledby="wallet-label" aria-describedby="wallet-help"></div>
    <span class="sr-only" id="wallet-help">Up and down arrow keys flip through the cards. Enter pops out the front card; Escape puts it back.</span>
    <span class="sr-only" id="wallet-status" aria-live="polite"></span>
  </div>

<script>
(() => {
  // Fictional cards: plain solid colours, a name and a masked number. No brands or logos.
  const CARDS = [
    { name: "Everyday",  num: "2048", color: "#B5441C" },  // Ember
    { name: "Travel",    num: "7315", color: "#416E5E" },  // Sage   (was #3F6B5C: 3.01:1 on dark)
    { name: "Savings",   num: "0926", color: "#4F60AE" },  // Indigo (was #4A5AA3: 2.85:1 on dark)
    { name: "Groceries", num: "4471", color: "#8F5079" },  // Plum   (was #8A4D75: 2.95:1 on dark)
    { name: "Gifts",     num: "5803", color: "#8A6420" },  // Ochre
  ];
  const N = CARDS.length;
  const PEEK = 40;            // px of each card visible above the front card
  const BACK = 3;             // how many cards peek out behind the front card
  const DRAG_PX = 100;        // px of drag that flips one card
  const PROJECT = 0.25;       // s: how far a flick carries (velocity × this)
  const MAX_FLICK = 3;        // a flick moves at most this many cards
  const TAP_SLOP = 6;         // px: less movement than this is a click, not a drag
  const FLIP = 100;           // degrees the front card turns over one card of drag (gone past 90°)
  const TILT = 6;             // degrees each card behind leans back
  const DEPTH = 24;           // px each card behind sits further away
  const POCKET_GAP = 6;       // px between the popped card and the sunken stack
  const POCKET_STRIP = 28;    // px of each sunken card left showing
  const POP_FORWARD = 16;     // px the popped card comes toward the viewer

  const root = document.documentElement;
  const stage = document.getElementById("stage");
  const statusEl = document.getElementById("wallet-status");

  // Theme: ?theme=light|dark overrides the system setting (the Lab page can also set data-theme).
  const qTheme = new URLSearchParams(location.search).get("theme");
  if (qTheme === "light" || qTheme === "dark") root.dataset.theme = qTheme;

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

  // ---------- Spring easing for hover / press (same as password-eye and checklist) ----------
  function springLinear(response, damping) {
    const w = 2 * Math.PI / response;
    const wd = w * Math.sqrt(1 - damping * damping);
    const x = t => 1 - Math.exp(-damping * w * t) * (Math.cos(wd * t) + (damping * w / wd) * Math.sin(wd * t));
    const dur = Math.log(1000) / (damping * w);
    const n = 48, pts = [];
    for (let i = 0; i <= n; i++) pts.push(+x(dur * i / n).toFixed(4));
    pts[n] = 1;
    return { easing: `linear(${pts.join(", ")})`, ms: Math.round(dur * 1000) };
  }
  if (CSS.supports("transition-timing-function", "linear(0, 1)")) {
    const press = springLinear(0.3, 0.6);
    root.style.setProperty("--spring-press", press.easing);
    root.style.setProperty("--spring-press-dur", press.ms + "ms");
  }

  // ---------- Squircle (site-design-system.md §2) ----------
  function squircle(w, h, r, s = 0.6) {
    const rad = d => d * Math.PI / 180, f = v => +v.toFixed(3);
    const p = (1 + s) * r;
    if (p > Math.min(w, h) / 2) throw new Error("too small for 60% smoothing: " + w + "x" + h + " r" + r);
    const am = 90 * (1 - s), L = Math.sin(rad(am / 2)) * r * Math.SQRT2;
    const p34 = r * Math.tan(rad((90 - am) / 4)), beta = 45 * s;
    const c = p34 * Math.cos(rad(beta)), d = c * Math.tan(rad(beta));
    const b = (p - L - c - d) / 3, a = 2 * b;
    const A=f(a),AB=f(a+b),ABC=f(a+b+c),BC=f(b+c),C=f(c),D=f(d),R=f(r),l=f(L);
    return [`M ${f(w-p)} 0`,`c ${A} 0 ${AB} 0 ${ABC} ${D}`,`a ${R} ${R} 0 0 1 ${l} ${l}`,`c ${D} ${C} ${D} ${BC} ${D} ${ABC}`,
      `L ${w} ${f(h-p)}`,`c 0 ${A} 0 ${AB} ${-D} ${ABC}`,`a ${R} ${R} 0 0 1 ${-l} ${l}`,`c ${-C} ${D} ${-BC} ${D} ${-ABC} ${D}`,
      `L ${f(p)} ${h}`,`c ${-A} 0 ${-AB} 0 ${-ABC} ${-D}`,`a ${R} ${R} 0 0 1 ${-l} ${-l}`,`c ${-D} ${-C} ${-D} ${-BC} ${-D} ${-ABC}`,
      `L 0 ${f(p)}`,`c 0 ${-A} 0 ${-AB} ${D} ${-ABC}`,`a ${R} ${R} 0 0 1 ${l} ${-l}`,`c ${C} ${-D} ${BC} ${-D} ${ABC} ${-D}`,`Z`].join(" ");
  }
  function shapeSquircle(el) {
    const w = el.offsetWidth, h = el.offsetHeight, r = +el.dataset.radius;
    if (!w || !h) return;
    const d = squircle(w, h, r);
    el.style.clipPath = `path("${d}")`;
    const svg = el.querySelector(":scope > svg.shape");
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    svg.querySelectorAll("path").forEach(p => p.setAttribute("d", d));
  }

  // ---------- Build cards ----------
  const cards = CARDS.map((c, i) => {
    const el = document.createElement("div");
    el.className = "card";
    el.dataset.i = i;
    el.setAttribute("aria-hidden", "true");
    el.innerHTML = `
      <div class="face sq" data-radius="16" style="--card:${c.color}">
        <svg class="shape" aria-hidden="true"><path class="fill"/><path class="ring"/></svg>
        <span class="name">${c.name}</span>
        <span class="num">•••• ${c.num}</span>
      </div>`;
    stage.appendChild(el);
    return { el, face: el.firstElementChild };
  });

  // The flip must stay inside the prototype's own area (its Lab card): near edge-on the falling
  // card's top edge comes about one card height toward the viewer, so with perspective it looks
  // wider than the stack and reaches below it. The stack is as wide as it can be (at most 320)
  // while that widest moment still fits inside the page, with a small margin, never clipped.
  const PERSPECTIVE = 1000, ORIGIN_Y = 0.2, FIT_MARGIN = 6, MAX_W = 320;
  const proto = stage.parentElement;
  function flipFits(w, availW, availH, labelH) {
    const h = w / 1.586, stageH = h + BACK * PEEK;
    const grow = PERSPECTIVE / (PERSPECTIVE - h);              // scale of the near edge
    const wide = w * grow;                                      // its projected width
    const below = (1 - ORIGIN_Y) * stageH * (grow - 1);         // how far it reaches under the stack
    const spaceBelow = (availH - (labelH + 8 + stageH)) / 2;    // the stage is centred in the page
    return wide <= availW - 2 * FIT_MARGIN && below <= spaceBelow - FIT_MARGIN;
  }
  function fitStack() {
    const availW = root.clientWidth, availH = root.clientHeight;
    const labelH = proto.firstElementChild.offsetHeight || 20;
    let w = Math.min(MAX_W, availW - 32);                       // 16px page padding each side
    while (w > 200 && !flipFits(w, availW, availH, labelH)) w -= 1;
    proto.style.width = w + "px";
  }
  fitStack();
  addEventListener("resize", fitStack);

  // Card height follows the credit-card ratio of the available width.
  let cardH = 202;
  const ro = new ResizeObserver(() => {
    cardH = Math.round(stage.offsetWidth / 1.586);
    stage.style.setProperty("--card-h", cardH + "px");
    stage.style.setProperty("--peek", PEEK + "px");
    cards.forEach(c => shapeSquircle(c.face));
    render();
  });
  ro.observe(stage);

  // ---------- State ----------
  // p: continuous position in the deck (p = 2 means card 2 is in front). Grows when dragging down.
  // q: pop-out progress 0..1 for card `popIdx`.
  const S = {
    p: 0, pv: 0, pTarget: 0,
    q: 0, qv: 0, qTarget: 0,
    popIdx: -1, pendingPop: -1,
    dragging: false,
  };
  const mod = (a, n) => ((a % n) + n) % n;
  const frontIdx = () => mod(Math.round(S.pTarget), N);

  // Where card i sits for deck position p (before pop-out is applied).
  // y: px from the stage top; a: degrees around the card's bottom edge (negative = top toward you);
  // z: px toward the viewer.
  function restPose(d) {
    const Y0 = BACK * PEEK;
    if (d < 0) {                                 // the front card flipping down, rigid, around its bottom edge
      return { y: Y0, a: Math.max(-FLIP, d * FLIP), z: 0 };
    }
    const k = Math.min(d, BACK);
    return {
      y: Y0 - k * PEEK,
      a: k * TILT,
      z: -d * DEPTH,                             // the hidden fifth card keeps going further back
    };
  }

  function render() {
    const popping = S.popIdx >= 0 && S.q !== 0;
    // Order of the other cards in the sunken stack (front-most first).
    const ds = cards.map((_, i) => { let d = mod(i - S.p, N); if (d > N - 1) d -= N; return d; });
    const others = cards.map((_, i) => i).filter(i => i !== S.popIdx).sort((a, b) => ds[a] - ds[b]);
    const pocketTop = cardH + POCKET_GAP;
    cards.forEach((c, i) => {
      const d = ds[i];
      const rest = restPose(d);
      let { y, a, z } = rest;
      if (popping) {
        let tgt;
        if (i === S.popIdx) {
          tgt = { y: 0, a: 0, z: POP_FORWARD };   // jumps up out of the stack
        } else {
          const r = others.indexOf(i);           // 0 = front-most of the rest
          tgt = { y: pocketTop + (others.length - 1 - r) * POCKET_STRIP, a: 0, z: -r * 6 };
        }
        y += (tgt.y - y) * S.q;
        a += (tgt.a - a) * S.q;
        z += (tgt.z - z) * S.q;
      }
      // Stacking always follows the deck order, also while a card is out or going back,
      // so a card never jumps in front of the cards that are in front of it.
      const zi = Math.round(100 - d * 10);
      c.el.style.transform =
        `translateY(${y.toFixed(2)}px) translateZ(${z.toFixed(2)}px) rotateX(${a.toFixed(2)}deg)`;
      c.el.style.zIndex = zi;
      const gone = a <= -90;                     // flipped past edge-on
      c.el.style.opacity = gone ? "0" : "1";
      c.el.style.pointerEvents = gone ? "none" : "";
      c.el.classList.toggle("is-current", S.popIdx >= 0 ? i === S.popIdx : i === frontIdx());
    });
    stage.classList.toggle("is-popped", S.popIdx >= 0 && S.qTarget === 1);
    stage.classList.toggle("is-pocket", S.popIdx >= 0);
  }

  // ---------- Springs (real elapsed time, sub-stepped, interruptible) ----------
  const springK = (response) => (2 * Math.PI / response) ** 2;
  const springC = (response, damping) => 2 * damping * (2 * Math.PI / response);
  // Deck travel: same values as the checklist row travel. Pop: same as the state-change spring.
  const DECK = { K: springK(0.5), C: springC(0.5, 0.8) };
  const POP  = { K: springK(0.42), C: springC(0.42, 0.72) };
  const CALM = { K: springK(0.2), C: springC(0.2, 1) };   // reduce motion: quick, no bounce

  let raf = 0, last = 0;
  function step(t) {
    const dt = Math.min(0.5, Math.max(0, (t - last) / 1000) || 0.016);
    last = t;
    const n = Math.max(1, Math.ceil(dt / 0.004)), h = dt / n;
    const deck = reduceMotion.matches ? CALM : DECK;
    const pop = reduceMotion.matches ? CALM : POP;
    for (let s = 0; s < n; s++) {
      if (!S.dragging) {
        S.pv += (-deck.K * (S.p - S.pTarget) - deck.C * S.pv) * h;
        S.p += S.pv * h;
      }
      S.qv += (-pop.K * (S.q - S.qTarget) - pop.C * S.qv) * h;
      S.q += S.qv * h;
    }
    let busy = false;
    if (!S.dragging) {
      if (Math.abs(S.p - S.pTarget) < 0.0005 && Math.abs(S.pv) < 0.005) { S.p = S.pTarget; S.pv = 0; }
      else busy = true;
    }
    if (Math.abs(S.q - S.qTarget) < 0.0005 && Math.abs(S.qv) < 0.005) {
      S.q = S.qTarget; S.qv = 0;
      if (S.q === 0 && S.popIdx >= 0) {
        S.popIdx = -1;
        if (S.pendingPop >= 0) { const k = S.pendingPop; S.pendingPop = -1; popOut(k); busy = true; }
      }
    } else busy = true;
    render();
    raf = busy ? requestAnimationFrame(step) : 0;
  }
  function kick() {
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(step); }
  }

  // ---------- Actions ----------
  function announce() {
    const c = CARDS[S.popIdx >= 0 && S.qTarget === 1 ? S.popIdx : frontIdx()];
    statusEl.textContent = S.popIdx >= 0 && S.qTarget === 1
      ? `${c.name} card, ending ${c.num}, popped out.`
      : `${c.name} card, ending ${c.num}, in front. ${frontIdx() + 1} of ${N}.`;
  }
  function flipTo(target, velocity = 0) {
    S.pTarget = target;
    S.pv = velocity;
    kick();
    announce();
  }
  function popOut(i) {
    if (S.popIdx >= 0 && S.popIdx !== i) {       // another card is still settling back
      S.pendingPop = i; S.qTarget = 0; kick(); return;
    }
    S.popIdx = i; S.qTarget = 1; kick(); announce();
  }
  function putBack() {
    if (S.popIdx < 0) return;
    S.pendingPop = -1; S.qTarget = 0; kick(); announce();
  }
  const isPopped = () => S.popIdx >= 0 && S.qTarget === 1;

  // ---------- Pointer: vertical drag (mouse, pen, touch), flick momentum, click to pop ----------
  let drag = null;
  stage.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    const cardEl = e.target.closest(".card");
    drag = {
      id: e.pointerId, y0: e.clientY, p0: S.p, moved: false,
      cardEl, samples: [{ t: e.timeStamp, y: e.clientY }],
    };
    if (cardEl) cardEl.classList.add("is-pressed");
    try { stage.setPointerCapture(e.pointerId); } catch (_) { /* pointer already gone */ }
  });
  stage.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dy = e.clientY - drag.y0;
    if (!drag.moved && Math.abs(dy) > TAP_SLOP && !isPopped()) {
      drag.moved = true;
      drag.y0 = e.clientY;                       // start tracking from here, no jump
      drag.p0 = S.p;
      S.dragging = true; S.pv = 0;
      stage.classList.add("is-dragging");
      if (drag.cardEl) drag.cardEl.classList.remove("is-pressed");
    }
    if (!drag.moved) return;
    S.p = drag.p0 + (e.clientY - drag.y0) / DRAG_PX;  // drag down = next card
    drag.samples.push({ t: e.timeStamp, y: e.clientY });
    while (drag.samples.length > 2 && e.timeStamp - drag.samples[0].t > 100) drag.samples.shift();
    render();
  });
  function endDrag(e, cancelled) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    if (d.cardEl) d.cardEl.classList.remove("is-pressed");
    if (!d.moved) {
      if (cancelled) return;
      // Click: pop the card out, or put the popped card back.
      if (isPopped()) putBack();
      else if (d.cardEl) popOut(+d.cardEl.dataset.i);
      return;
    }
    S.dragging = false;
    stage.classList.remove("is-dragging");
    // Release velocity (cards per second) from the last ~100ms of movement.
    let v = 0;
    const a = d.samples[0], b = d.samples[d.samples.length - 1];
    if (!cancelled && b.t - a.t > 8 && e.timeStamp - b.t < 80) v = (b.y - a.y) / (b.t - a.t) * 1000 / DRAG_PX;
    // A flick carries on with its momentum, then the spring settles on a whole card.
    let target = Math.round(S.p + v * PROJECT);
    const base = Math.round(S.p);
    target = Math.max(base - MAX_FLICK, Math.min(base + MAX_FLICK, target));
    flipTo(target, v);
  }
  // Touch: the stack owns vertical drags. touch-action: none already stops the page from
  // scrolling; this also covers browsers that ignore it inside a frame (older iOS Safari).
  stage.addEventListener("touchmove", e => { if (drag) e.preventDefault(); }, { passive: false });
  stage.addEventListener("pointerup", e => endDrag(e, false));
  stage.addEventListener("pointercancel", e => endDrag(e, true));
  stage.addEventListener("lostpointercapture", e => { if (drag && e.pointerId === drag.id) endDrag(e, true); });

  // Clicking anywhere outside the cards (blank space in the prototype) puts a popped card back.
  document.addEventListener("pointerdown", e => {
    if (isPopped() && !e.target.closest(".card")) putBack();
  });

  // ---------- Keyboard ----------
  stage.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (S.popIdx >= 0) { putBack(); return; }  // first put the card back, then flip
      flipTo(S.pTarget + (e.key === "ArrowDown" ? 1 : -1));
    } else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (isPopped()) putBack(); else popOut(frontIdx());
    } else if (e.key === "Escape") {
      putBack();
    }
  });

  render();
  announce();
})();
</script>
</body>
</html>
