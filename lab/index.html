    <!-- Filters (§6): the selected pill slides between them on spring-state (lab.js). -->
    <div class="lab-filters" data-page-enter role="group" aria-label="Filter prototypes by interaction" data-lab-filters>
      <span class="lab-pill" aria-hidden="true"><i class="lab-pill__l"></i><i class="lab-pill__m"></i><i class="lab-pill__r"></i></span>
      <button class="lab-filter" type="button" data-filter="all" data-label="All" aria-pressed="true">All</button>
      <button class="lab-filter" type="button" data-filter="press" data-label="Press" aria-pressed="false">Press</button>
      <button class="lab-filter" type="button" data-filter="hover" data-label="Hover" aria-pressed="false">Hover</button>
      <button class="lab-filter" type="button" data-filter="drag" data-label="Drag" aria-pressed="false">Drag</button>
    </div>
    <p class="visually-hidden" aria-live="polite" data-lab-status></p>

    <!-- Cards are built from /content/lab.json; each hosts its prototype live (lab.js). -->
    <ul class="lab-grid" data-lab-grid></ul>
